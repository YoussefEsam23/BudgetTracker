<mat-toolbar color="primary" *ngIf="!isLoginPage()" class="mat-elevation-z4">
  <mat-icon style="margin-right: 10px;">account_balance_wallet</mat-icon>
  <span>BudgetTracker</span>
  
  <span class="spacer"></span>
  
  <!-- Navigation Links -->
      <nav class="nav-links">
        <a mat-button routerLink="/dashboard" routerLinkActive="active-tab">
          <mat-icon>dashboard</mat-icon> Dashboard
        </a>
        <a mat-button routerLink="/transactions" routerLinkActive="active-tab">
          <mat-icon>receipt_long</mat-icon> Transactions
        </a>
        <a mat-button routerLink="/budget" routerLinkActive="active-tab">
          <mat-icon>pie_chart</mat-icon> Budgets
        </a>
        <a mat-button routerLink="/goals" routerLinkActive="active-tab">
          <mat-icon>track_changes</mat-icon> Goals
        </a>
        <a mat-button routerLink="/reports" routerLinkActive="active-tab">
          <mat-icon>bar_chart</mat-icon> Reports
        </a>
      </nav>

  <button mat-icon-button (click)="onLogout()" matTooltip="Logout">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="main-content">
  <router-outlet></router-outlet>
</div>
